<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Squeeze: Image Compressor</title>
    
    <!-- materialize css link and icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    
    <!-- PWA Manifest Link (CRITICAL PWA REQUIREMENT) -->
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- simple nav bar -->
    <header>
        <nav class="lime darken-1">
            <div class="nav-wrapper container">
                <a href="#!" class="brand-logo">Pixel Squeeze: Image Compressor</a>
            </div>
        </nav>
    </header>

    <!-- main content -->
    <main class="container">
        <div class="row">
            <div class="col s12">
                <div class="card-panel white z-depth-3 center-align" style="border-radius: 8px;">
                    <i class="material-icons large lime-text text-darken-3">photo_camera</i>
                    <h5>Get Your Images Small!</h5>
                    <p class="grey-text">Real client-side image compression for JPEG and PNG (converted to JPEG).</p>

                    <!-- file input -->
                    <div class="file-field input-field" style="margin-top: 30px;">
                        <div class="btn lime darken-1 waves-effect waves-light" style="border-radius: 4px;">
                            <span>Select Picture</span>
                            <input type="file" id="fileInput" accept="image/jpeg, image/png">
                        </div>
                        <div class="file-path-wrapper">
                            <input class="file-path validate" type="text" placeholder="No file selected yet">
                        </div>
                    </div>

                    <!-- settings (hidden until file selected) -->
                    <div id="settings-area" style="display: none; margin-top: 25px; text-align: left;">
                        <p>Selected File: <strong id="fileNameDisplay"></strong></p>
                        
                        <!-- quality slider (basic HTML range input) -->
                        <label for="qualitySlider">JPEG Compression Quality (10 - 100):</label>
                        <p class="range-field">
                            <span id="qualityValue" class="right lime-text text-darken-3">80%</span>
                            <input type="range" id="qualitySlider" min="10" max="100" value="80" />
                        </p>
                        
                        <!-- action button -->
                        <a id="compressButton" class="waves-effect waves-light btn-large lime darken-1 full-width" style="width: 100%; margin-top: 20px; border-radius: 4px;" onclick="startCompression()">
                            <i class="material-icons left">compress</i>Squeeze & Download
                        </a>
                        
                        <!-- simple loading bar -->
                        <div class="progress" id="loadingIndicator" style="display: none;">
                            <div class="indeterminate lime darken-2"></div>
                        </div>
                        
                        <!-- output info (result display) -->
                        <div id="sizeInfo" class="flow-text" style="margin-top: 15px; font-weight: bold;"></div>
                    </div>

                    <!-- output preview (actual compressed result) -->
                    <!-- We use an offscreen canvas for processing -->
                    <canvas id="imageCanvas" style="display: none;"></canvas>
                    <img id="output-image" style="max-width: 100%; height: auto; border-radius: 4px; margin-top: 20px; display: none; border: 1px solid #c0ca33;" alt="Compressed Preview" />

                </div>
            </div>
        </div>
    </main>

    <!-- PWA install prompt banner -->
    <div id="install-prompt">
        Install the app for instant access and offline compression!
        <a href="#" class="btn-small white lime-text text-darken-4 right" id="install-button" onclick="promptInstall()" style="border-radius: 4px; font-weight: bold;">Install</a>
    </div>

    <!-- materialize JS and custom script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
        // --- global variables ---
        const fileInput = document.getElementById('fileInput');
        const settingsArea = document.getElementById('settings-area');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityValueSpan = document.getElementById('qualityValue');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const sizeInfo = document.getElementById('sizeInfo');
        const outputImage = document.getElementById('output-image');
        const imageCanvas = document.getElementById('imageCanvas');
        const ctx = imageCanvas.getContext('2d');
        
        let originalFile = null;
        let originalFileSize = 0; // In bytes

        // utility to convert bytes to human-readable format (KB, MB, etc.)
        function humanFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // --- UI updates ---
        qualitySlider.addEventListener('input', () => {
            qualityValueSpan.textContent = `${qualitySlider.value}%`;
        });
        
        fileInput.addEventListener('change', (e) => {
            originalFile = e.target.files[0];
            if (originalFile) {
                // ensure only JPEG and PNG are allowed
                if (!originalFile.type.match('image/(jpeg|png)')) {
                    M.toast({html: 'Only JPEG and PNG images are supported.', classes: 'red darken-2'});
                    fileInput.value = ''; // clear the input
                    settingsArea.style.display = 'none';
                    return;
                }
                
                originalFileSize = originalFile.size;
                fileNameDisplay.textContent = originalFile.name;
                settingsArea.style.display = 'block';
                outputImage.style.display = 'none';
                sizeInfo.textContent = `Original Size: ${humanFileSize(originalFileSize)}`;
                
                M.toast({html: 'Image loaded! Set your quality and squeeze.', classes: 'green darken-1'});
            }
        });

        // --- compression and download Function ---
        function startCompression() {
            if (!originalFile) {
                return M.toast({html: 'Please pick an image first!', classes: 'red darken-2'});
            }

            loadingIndicator.style.display = 'block';
            sizeInfo.innerHTML = `Original Size: ${humanFileSize(originalFileSize)}<br>Compressing...`;
            outputImage.style.display = 'none';

            M.toast({html: 'Processing image...', classes: 'blue'});

            // 1. read the selected file into an image object
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    
                    // 2. set canvas dimensions to match the image
                    imageCanvas.width = img.width;
                    imageCanvas.height = img.height;

                    // 3. draw the original image onto the canvas
                    ctx.drawImage(img, 0, 0, img.width, img.height);

                    // 4. get the compression settings
                    const quality = parseInt(qualitySlider.value) / 100;
                    const mimeType = 'image/jpeg'; // We will always output as JPEG for compression benefits

                    // 5. COMPRESSION: get the compressed Data URL
                    const compressedDataURL = imageCanvas.toDataURL(mimeType, quality);
                    
                    // 6. convert Data URL to a blob to measure its size and download it
                    const blob = dataURLToBlob(compressedDataURL);
                    const compressedFileSize = blob.size;
                    
                    // 7. calculate stats and update UI
                    const reduction = ((originalFileSize - compressedFileSize) / originalFileSize) * 100;
                    const originalFileName = originalFile.name.split('.').slice(0, -1).join('.');
                    const compressedFileName = `${originalFileName}_squeezed_${quality * 100}.jpeg`;

                    loadingIndicator.style.display = 'none';
                    outputImage.src = compressedDataURL;
                    outputImage.style.display = 'block';
                    
                    sizeInfo.innerHTML = `
                        Original Size: ${humanFileSize(originalFileSize)}<br>
                        Compressed Size: <span class="green-text text-darken-3">${humanFileSize(compressedFileSize)}</span><br>
                        Size Reduction: <span class="green-text text-darken-3">${reduction.toFixed(1)}%</span>
                    `;

                    // 8. trigger Download
                    const downloadLink = document.createElement('a');
                    downloadLink.href = URL.createObjectURL(blob);
                    downloadLink.download = compressedFileName;
                    downloadLink.click();
                    URL.revokeObjectURL(downloadLink.href); // Clean up memory

                    M.toast({html: `Compression successful! Saved ${humanFileSize(compressedFileSize)}.`, classes: 'green darken-2'});

                };
                img.src = event.target.result; // start loading the image
            };
            reader.readAsDataURL(originalFile); // start reading the file
        }

        // utility function to convert DataURL to blob for accurate size calculation and download
        function dataURLToBlob(dataURL) {
            const parts = dataURL.split(';base64,');
            const contentType = parts[0].split(':')[1];
            const raw = window.atob(parts[1]);
            const rawLength = raw.length;
            const uInt8Array = new Uint8Array(rawLength);

            for (let i = 0; i < rawLength; ++i) {
                uInt8Array[i] = raw.charCodeAt(i);
            }
            return new Blob([uInt8Array], { type: contentType });
        }

        // --- PWA setup (for installability/offline) ---
        let deferredPrompt;
        const installPromptDiv = document.getElementById('install-prompt');

        // service worker: required for PWA status (offline capability)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Assumes service-worker.js is in the same directory
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker Registered Successfully.'))
                    .catch(err => console.error('Service Worker Registration Failed:', err));
            });
        }
        
        // before install prompt: required for home screen install
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Only show the banner if the app isn't already installed
            if (!window.matchMedia('(display-mode: standalone)').matches) {
                installPromptDiv.style.display = 'block';
            }
        });

        // function to trigger the actual browser install dialog
        function promptInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        M.toast({html: 'App installed! It lives on your home screen now.', classes: 'blue'});
                    } else {
                        M.toast({html: 'Installation cancelled.', classes: 'orange'});
                    }
                    deferredPrompt = null;
                    installPromptDiv.style.display = 'none';
                });
            }
        }
    </script>
</body>
</html>
